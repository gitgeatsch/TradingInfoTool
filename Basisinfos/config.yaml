                                        # EHRLICH ZUR EVIDENZ - was traegt und was nicht:
                                        #
                                        # TRAEGT: die betroffene Gruppe liegt bei 10,5%
                                        # Trefferquote, Wilson-Intervall [4-24%]. Das
                                        # obere Ende bleibt unter dem Break-even von 33%
                                        # (CRV 2,0) - diese Gruppe ist also mit hoher
                                        # Sicherheit verlustbringend. Das ist der
                                        # eigentliche Grund fuer das Veto.
                                        #
                                        # TRAEGT NICHT: der Vergleich zur nicht
                                        # betroffenen Gruppe (22,6%). Der haelt der
                                        # Sensitivitaetspruefung nur teilweise stand -
                                        # ohne LINK (der 4 von 7 Treffern der
                                        # Vergleichsgruppe stellt) schrumpft die Differenz
                                        # von 12,1 auf 5,3 Prozentpunkte. Nur-LONG
                                        # verstaerkt sie (+17,6pp), Nur-SHORT kippt sie -
                                        # dort ist die Vergleichsgruppe aber n=3 und damit
                                        # ohne Aussage. Die Wilson-Intervalle ueberlappen
                                        # in allen Varianten.
                                        #
                                        # Zusaetzlich stuetzend: dieselbe Gruppe wird vom
                                        # bereits abgesicherten RM-1b getroffen (0 von 20,
                                        # p=0,0005), und der theoretische Grund (Stop
                                        # innerhalb der normalen Tagesschwankung wird von
                                        # Rauschen ausgeloest) ist datenunabhaengig.
                                        #
