# REGEL0 im Betrieb - Startwerte der Positionsgroesse (E-44, Nutzer 02.10.2026)
#
# Nutzer: "Ja, so als Startwerte eintragen ... wenn moeglich baue es so, dass dies einfach und flexibel angepasst werden kann bei Bedarf."
# Und davor: "Kapitalschutz ist meine Angelegenheit und sollte nicht im Mittelpunkt stehen. Wenn das System funktioniert, kann man nachschaerfen."
#
# ⚠️ Bewusst NICHT in config.yaml: die config.yaml am Notebook wird bei Watchlist-Aenderungen beschrieben und weicht vom Repo ab
#    (z. B. XDC). Eine Aenderung dort wuerde beim git pull kollidieren. Diese Datei gehoert nur der REGEL0 im Betrieb.
#
# Rechnung je Trade (agent/regel0_groesse.py):
#   Einsatz = Positionswert / Hebelstufe der REGEL0, begrenzt auf [einsatz_min_eur, einsatz_max_eur]
#   5x -> 300 EUR, 3x -> 500 EUR, 2x -> 750 EUR bei Positionswert 1.500 EUR
#   hoechster Verlust je Trade = etwa der Einsatz (Liquidation, selten) plus Gebuehren
# Die Hebelstufe selbst kommt aus der REGEL0 (ATR-Modell, Grenze 2 %) und wird HIER NICHT veraendert.

positionswert_eur: 1500        # gleicher Positionswert je Trade: jeder Trade ist im Markt gleich gross
einsatz_min_eur: 300           # Nutzer: 300 bis 800 EUR je Trade
einsatz_max_eur: 800
richtwert_gleichzeitig: 4      # Nutzer: max. 4 Trades gleichzeitig - als RICHTWERT, nicht als Sperre
sperre_ab_richtwert: false     # false = Signal kommt trotzdem, die Mail vermerkt "Richtwert erreicht"
                               # (gemessen 02.10.: 41 % der Signale der Hebel-Liste kamen bei schon 4 offenen, und sie waren nicht schlechter)

# S7-4 (E-46, Nutzer 03.10.2026: "Ja D1 bis D4 wie vorgeschlagen")
alter_hebelweg_aus: true       # die REGEL0 ersetzt den Hebel (F1): die Rollen-Kette schlaegt keinen Hebel mehr vor; Spot laeuft weiter
testwoche_bis: "2026-10-10"    # GEPLANT bis einschliesslich diesem Tag tragen die REGEL0-Mails den Vermerk TESTWOCHE (E-43); leer = aus
testwoche_freigegeben: true    # FREIGEGEBEN 10.10.2026 (Nutzer: "Ja, Freigabe jetzt setzen und pushen"; Schritt7 Par. 23.36/23.38). S-2 (E-57): endet NUR mit deinem Ja. Bis dahin blieb der
                               # Vermerk auch nach dem geplanten Tag stehen (*Freigabe ausstehend*); Auswertung: pruefe_testwoche.py

# R-4 (E-51, Nutzer 03.10.2026: "Ja R-1 bis R-4 wie vorgeschlagen"; Nutzer: "eine Stilllegung der aktuellen Kette waere sogar ein Vorteil")
spot_kette_angehalten: true    # GESETZT 05.10.2026 (Nutzer: *Schalter A setzen*, E-67) - true = die Rollen-Kette (Spot, alle Gruppen) laeuft NICHT - der alte Weg bleibt trotzdem aus (aktiv_fuer
                               # unveraendert). Es entstehen keine Spot-Signale, keine Spot-/Bestands-Verkaufsmails, keine Lagebilder; die
                               # REGEL0 (Rechnung, Mails, LLM-Block) und der Ausstiegsjob (Stop-Nachzieh-Sammelmail) laufen weiter.
                               # Wirkt ab dem naechsten Umlauf (15 min) - die Datei wird je Umlauf gelesen, kein Neustart noetig. Par. 20.13

# O29 (E-83/E-84, 08.10.2026): Binance-Ankuendigungen (Delisting, Monitoring) als FAKT in der Signalmail + Vorwaertsprotokoll fuer alle
# Signale (agent/binance_ankuendigungen.py, Voranalyse_Schritt7 Par. 23.24/23.28). Vorgebaut mit Schalter AUS - EINGESCHALTET wird erst
# nach der Testwoche (Freigabe). Wird je Lauf gelesen, kein Neustart noetig. Aus = kein Abruf, keine Mailzeile, kein Protokoll.
ankuendigung_aktiv: true          # EINGESCHALTET 10.10.2026 (Nutzer: "1. ja O29 einschalten"; Paket P8, nach Freigabe E-94)
# H15 (09.10.2026, Nutzer: "Ja H15 zuerst, Warnung bei 15 % Abstand", Schritt7 §23.29): Fuehrung ECHTER Hebelpositionen
# im Abgleich-Lauf (alle 15 min, unabhaengig von der Rollen-Kette); Mail bei Abstand Kurs -> Liquidation unter der Schwelle,
# Stufen 15 / 10 / 5 % (jede tiefere sofort, dieselbe hoechstens einmal am Tag). Nur am Betriebsgeraet.
hebelfuehrung_aktiv: true
liquidations_warnung_abstand: 0.15
